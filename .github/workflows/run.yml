name: PWD Automator

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 2 * * *'
    - cron: '0 4 * * *'
    - cron: '0 6 * * *'
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    - cron: '0 22 * * *'
    
  workflow_dispatch:
    inputs:
      command:
        description: 'Calistirilacak komut (bos = command.txt)'
        required: false
        default: ''

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set command from input
        if: github.event.inputs.command != ''
        run: echo '${{ github.event.inputs.command }}' > command.txt

      - name: Run PWD Automator
        env:
          ACCOUNT_1_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
          ACCOUNT_1_PASSWORD: ${{ secrets.ACCOUNT_1_PASSWORD }}
          ACCOUNT_2_EMAIL: ${{ secrets.ACCOUNT_2_EMAIL }}
          ACCOUNT_2_PASSWORD: ${{ secrets.ACCOUNT_2_PASSWORD }}
          ACCOUNT_3_EMAIL: ${{ secrets.ACCOUNT_3_EMAIL }}
          ACCOUNT_3_PASSWORD: ${{ secrets.ACCOUNT_3_PASSWORD }}
          ACCOUNT_4_EMAIL: ${{ secrets.ACCOUNT_4_EMAIL }}
          ACCOUNT_4_PASSWORD: ${{ secrets.ACCOUNT_4_PASSWORD }}
          ACCOUNT_5_EMAIL: ${{ secrets.ACCOUNT_5_EMAIL }}
          ACCOUNT_5_PASSWORD: ${{ secrets.ACCOUNT_5_PASSWORD }}
          COMMAND: ${{ secrets.COMMAND }}
        run: python main.py --env

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 3
